<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            font-family: Arial;
        }

        .calculator {
            width:  360px;
            padding: 18px;
            background-color: #222;
            border: 2px solid white;
            box-shadow: 0 0 20px gray;                  
            border-radius: 14px;
        }

        .screen {
            background-color: white;
            height: 78px;
            text-align: right;
            font-size:  42px;
            padding: 10px 14px;
            margin-bottom: 14px;
            border-radius: 8px;
            box-sizing: border-box;
            line-height: 58px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            flex: 1;
            height: 68px;
            font-size: 22px;
            border: none;
            background-color: lightgray;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background-color: white;
            transform: scale(1.1);
        }

        .operator {
            background-color: orange;
        }

        .clear {
            background-color: red;
            color: white;
        }

        .equal {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="screen">0</div>

        <div class="row">
            <button class="clear">C</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
        </div>

        <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">×</button>
        </div>

        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">−</button>
        </div>

        <div class="row">
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
            <button class="operator">+</button>
        </div>

    </div>

</body>
</html>
